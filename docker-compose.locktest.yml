services:
  db:
    ports:
      - "55432:5432"

  backend:
    ports:
      - "58080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_BASE_INTERNAL: http://backend:8080
    ports:
      - "55173:5173"
    depends_on:
      backend:
        condition: service_healthy
