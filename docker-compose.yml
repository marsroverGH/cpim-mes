services:
  db:
    image: postgres:16.15-alpine3.24
    environment:
      POSTGRES_USER: cpim
      POSTGRES_PASSWORD: cpim
      POSTGRES_DB: cpim
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cpim -d cpim"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot step: applies migrations and sets up the application role. Only this
  # service receives the privileged database URL.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["migrate"]
    restart: "no"
    environment:
      APP_ENV: ${APP_ENV:-development}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgres://cpim:cpim@db:5432/cpim?sslmode=disable}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-cpim_app}
      MIGRATION_TIMEOUT: ${MIGRATION_TIMEOUT:-10m}
      MIGRATION_INSTALLED_BY: ${MIGRATION_INSTALLED_BY:-docker-compose-migrate}
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # Safe shared defaults. Production-specific fail-closed values are supplied
      # by docker-compose.prod.yml; development host ports live in the dev override.
      # Setting APP_ENV=production on this base file alone is expected to fail closed.
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgres://cpim_app:cpim_app@db:5432/cpim?sslmode=disable}
      HTTP_ADDR: ":8080"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-in-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-Lax}
      LOGIN_RATE_LIMIT_WINDOW: ${LOGIN_RATE_LIMIT_WINDOW:-15m}
      LOGIN_RATE_LIMIT_IP_MAX_FAILURES: ${LOGIN_RATE_LIMIT_IP_MAX_FAILURES:-30}
      LOGIN_RATE_LIMIT_USERNAME_MAX_FAILURES: ${LOGIN_RATE_LIMIT_USERNAME_MAX_FAILURES:-5}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-cpim-mes-backend}
      OTEL_EXPORT_TIMEOUT: ${OTEL_EXPORT_TIMEOUT:-5s}
      OTEL_BSP_MAX_QUEUE_SIZE: ${OTEL_BSP_MAX_QUEUE_SIZE:-256}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Tokyo}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 12

volumes:
  db_data:
