name: v0.41.1 Release Candidate Gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-v0.41.1
  cancel-in-progress: false

env:
  GO_VERSION: '1.26.7'
  NODE_VERSION: '24.20.0'
  NPM_VERSION: '11.19.0'
  RELEASE_VERSION: 'v0.41.1'
  RC_VERSION: 'v0.41.1-rc.3'

jobs:
  final-clean-room:
    name: Final clean-room / security / DR / E2E
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.13'
      - name: Pin npm
        run: npm install --global npm@${{ env.NPM_VERSION }}
      - name: Prepare immutable RC build metadata
        shell: bash
        run: |
          test "$RC_VERSION" = "v0.41.1-rc.3"
          echo "VCS_REF=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Run final clean-room Release Candidate gate
        env:
          CPIM_HTTP_PORT: '8080'
        run: ./scripts/final_clean_room_release_gate.sh
      - name: Verify source tree stayed unchanged during gate
        run: git diff --exit-code && test -z "$(git status --porcelain --untracked-files=no)"
      - name: Upload verified Release Candidate bundle
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cpim-mes-${{ env.RC_VERSION }}-${{ github.run_id }}
          path: release-candidate-bundle
          if-no-files-found: error
          retention-days: 30
      - name: Upload clean-room diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rc-clean-room-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/cpim-mes-rc-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rc-playwright-report-${{ github.run_id }}
          path: e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 14
      - name: Diagnostic Docker logs
        if: failure()
        env:
          POSTGRES_PASSWORD: diagnostic-placeholder
          DATABASE_URL: postgres://cpim:diagnostic-placeholder@db:5432/cpim?sslmode=disable
          JWT_SECRET: diagnostic-placeholder-not-used-for-startup
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --no-color || true
