name: Finalize v0.41.1-rc.4 security remediation and promote GA

on:
  push:
    branches:
      - bootstrap/v0.41.1-rc.1-upload

permissions:
  contents: write
  actions: write

concurrency:
  group: finalize-v0.41.1-rc.4
  cancel-in-progress: false

jobs:
  finalize-rc4:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      RC4_BRANCH: release/v0.41.1-rc.4
      GA_TAG: v0.41.1
      NEW_GO_VERSION: '1.26.10'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RC4_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.NEW_GO_VERSION }}
          cache: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.20.0'
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@11.19.0

      - name: Preflight RC4 and absent GA tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$RC4_BRANCH" --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$RC4_BRANCH")"
          grep -q "RC_VERSION: 'v0.41.1-rc.4'" .github/workflows/release-candidate.yml
          grep -q "GO_VERSION: '1.26.10'" .github/workflows/release-candidate.yml
          if git ls-remote --exit-code --tags origin "refs/tags/$GA_TAG" >/dev/null 2>&1; then
            echo "ERROR: $GA_TAG already exists; refusing overwrite." >&2
            exit 1
          fi

      - name: Apply runtime and dependency security remediation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          files = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          for name in files:
              if not name:
                  continue
              p = Path(name)
              try:
                  s = p.read_text()
              except (UnicodeDecodeError, IsADirectoryError):
                  continue
              if name != ".github/workflows/release-candidate.yml":
                  s = s.replace("v0.41.1-rc.3", "v0.41.1-rc.4")
              s = s.replace("1.26.7", "1.26.10")
              p.write_text(s)
          PY

          (
            cd backend
            go get github.com/golang-jwt/jwt/v5@v5.2.2
            go get github.com/go-chi/chi/v5@v5.3.0
            go get github.com/jackc/pgx/v5@v5.9.2
            go get golang.org/x/net@v0.60.0
            go get golang.org/x/text@v0.41.0
            go mod tidy
          )

          (
            cd frontend
            npm install --save-exact axios@1.21.0 vue@3.5.45
            npm install --save-dev --save-exact vite@6.4.5
          )

          (
            cd e2e
            npm install --save-dev --save-exact @playwright/test@1.64.1
          )

      - name: Pre-commit security proof
        shell: bash
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          (
            cd backend
            govulncheck ./...
          )
          (
            cd frontend
            npm audit --omit=dev --audit-level=high
            npm audit --audit-level=critical
            npm run typecheck
            npm run build
          )
          (
            cd e2e
            npm audit --audit-level=critical
          )

      - name: Recalculate and verify governed source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          checksum = Path("SHA256SUMS.txt")
          out = []
          for line in checksum.read_text().splitlines():
              if not line.strip():
                  continue
              _, path = line.split("  ", 1)
              p = Path(path)
              if not p.is_file():
                  raise SystemExit(f"checksum path missing: {path}")
              out.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {path}")
          checksum.write_text("\n".join(out) + "\n")
          PY
          python3 scripts/verify_source_checksums.py
          python3 scripts/check_runtime_versions.py
          python3 scripts/check_dependency_locks.py
          python3 scripts/check_ci_dependency_policy.py
          python3 backend/scripts/check_final_release_candidate.py
          python3 scripts/test_release_candidate_unit.py
          if grep -R "NewRouter(nil" -n backend/internal/api --include='*_test.go'; then
            echo "ERROR: nil Router test fixture remains" >&2
            exit 1
          fi

      - name: Backend full verification before RC commit
        shell: bash
        run: |
          set -euo pipefail
          (
            cd backend
            go mod verify
            go vet -mod=readonly ./...
            go test -mod=readonly -race -count=1 ./...
          )

      - name: Commit RC4 security remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CPIM-MES Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "release: remediate v0.41.1 security gate findings"
          git push origin "HEAD:refs/heads/$RC4_BRANCH"
          RC4_SHA="$(git rev-parse HEAD)"
          echo "RC4_SHA=$RC4_SHA" >> "$GITHUB_ENV"
          echo "RC4_SHA=$RC4_SHA"

      - name: Dispatch authoritative Final Clean-room Gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release-candidate.yml --ref "$RC4_BRANCH"
          for i in $(seq 1 60); do
            RUN_ID="$(gh run list --workflow release-candidate.yml --branch "$RC4_BRANCH" --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$RC4_SHA\") | .databaseId" | head -n1)"
            if [ -n "$RUN_ID" ]; then
              echo "RC_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
              echo "RC_RUN_ID=$RUN_ID"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: dispatched RC4 workflow run not found" >&2
          exit 1

      - name: Wait for Final Clean-room PASS
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 420); do
            STATE="$(gh run view "$RC_RUN_ID" --json status,conclusion,headSha,url)"
            STATUS="$(jq -r '.status' <<<"$STATE")"
            CONCLUSION="$(jq -r '.conclusion // ""' <<<"$STATE")"
            HEAD_SHA="$(jq -r '.headSha' <<<"$STATE")"
            URL="$(jq -r '.url' <<<"$STATE")"
            test "$HEAD_SHA" = "$RC4_SHA"
            echo "RC4 gate status=$STATUS conclusion=$CONCLUSION url=$URL"
            if [ "$STATUS" = "completed" ]; then
              test "$CONCLUSION" = "success" || {
                gh run view "$RC_RUN_ID" --log-failed || true
                exit 1
              }
              echo "RC_RUN_URL=$URL" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 15
          done
          echo "ERROR: Final Clean-room gate timeout" >&2
          exit 1

      - name: Create annotated GA tag after PASS only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CPIM-MES Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git tag -a "$GA_TAG" "$RC4_SHA" \
            -m "CPIM-MES v0.41.1 Production Hardening" \
            -m "Final Clean-room PASS: $RC_RUN_URL"
          git push origin "refs/tags/$GA_TAG"

      - name: Verify GA tag identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags
          test "$(git rev-list -n1 "$GA_TAG")" = "$RC4_SHA"
          echo "GA_TAG=$GA_TAG"
          echo "GA_COMMIT=$RC4_SHA"
          echo "FINAL_GATE=$RC_RUN_URL"
