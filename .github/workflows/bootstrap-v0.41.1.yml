name: Dispatch verified v0.41.1-rc.4 and promote GA

on:
  push:
    branches:
      - bootstrap/v0.41.1-rc.1-upload

permissions:
  contents: write
  actions: write

concurrency:
  group: promote-v0.41.1-rc.4
  cancel-in-progress: false

jobs:
  gate-and-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RC4_BRANCH: release/v0.41.1-rc.4
      RC4_SHA: 65f27fa66ef1e8ee7cb98d0ec6c4477d325366dc
      GA_TAG: v0.41.1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Preflight exact RC4 identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$RC4_BRANCH" --tags
          test "$(git rev-parse "origin/$RC4_BRANCH")" = "$RC4_SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/$GA_TAG" >/dev/null 2>&1; then
            echo "ERROR: $GA_TAG already exists; refusing overwrite." >&2
            exit 1
          fi

      - name: Dispatch authoritative Final Clean-room Gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release-candidate.yml --ref "$RC4_BRANCH"
          for i in $(seq 1 60); do
            RUN_ID="$(gh run list --workflow release-candidate.yml --branch "$RC4_BRANCH" --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$RC4_SHA\") | .databaseId" | head -n1)"
            if [ -n "$RUN_ID" ]; then
              echo "RC_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
              echo "RC_RUN_ID=$RUN_ID"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: dispatched RC4 workflow run not found" >&2
          exit 1

      - name: Wait for Final Clean-room PASS
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 420); do
            STATE="$(gh run view "$RC_RUN_ID" --json status,conclusion,headSha,url)"
            STATUS="$(jq -r '.status' <<<"$STATE")"
            CONCLUSION="$(jq -r '.conclusion // ""' <<<"$STATE")"
            HEAD_SHA="$(jq -r '.headSha' <<<"$STATE")"
            URL="$(jq -r '.url' <<<"$STATE")"
            test "$HEAD_SHA" = "$RC4_SHA"
            echo "RC4 gate status=$STATUS conclusion=$CONCLUSION url=$URL"
            if [ "$STATUS" = "completed" ]; then
              test "$CONCLUSION" = "success" || {
                gh run view "$RC_RUN_ID" --log-failed || true
                exit 1
              }
              echo "RC_RUN_URL=$URL" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 15
          done
          echo "ERROR: Final Clean-room gate timeout" >&2
          exit 1

      - name: Create annotated GA tag after PASS only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CPIM-MES Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git tag -a "$GA_TAG" "$RC4_SHA" \
            -m "CPIM-MES v0.41.1 Production Hardening" \
            -m "Final Clean-room PASS: $RC_RUN_URL"
          git push origin "refs/tags/$GA_TAG"

      - name: Verify GA tag identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags
          test "$(git rev-list -n1 "$GA_TAG")" = "$RC4_SHA"
          echo "GA_TAG=$GA_TAG"
          echo "GA_COMMIT=$RC4_SHA"
          echo "FINAL_GATE=$RC_RUN_URL"
