name: Bootstrap v0.41.1 RC gate and GA tag

on:
  push:
    branches:
      - bootstrap/v0.41.1-rc.1-upload

permissions:
  contents: write
  actions: write

concurrency:
  group: bootstrap-v0.41.1-rc.1-gate
  cancel-in-progress: false

jobs:
  dispatch-gate-and-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RC_BRANCH: release/v0.41.1-rc.1
      RC_SHA: d7c7f07f4591bfdb06c8d1e3a068c59bad07403e
      GA_TAG: v0.41.1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Preflight RC identity and absent GA tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$RC_BRANCH" --tags
          test "$(git rev-parse "origin/$RC_BRANCH")" = "$RC_SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/$GA_TAG" >/dev/null 2>&1; then
            echo "ERROR: tag $GA_TAG already exists; refusing overwrite." >&2
            exit 1
          fi

      - name: Dispatch authoritative release-candidate.yml
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release-candidate.yml --ref "$RC_BRANCH"
          for i in $(seq 1 60); do
            RUN_ID="$(gh run list --workflow release-candidate.yml --branch "$RC_BRANCH" --event workflow_dispatch --limit 20 --json databaseId,headSha,createdAt --jq ".[] | select(.headSha == \"$RC_SHA\") | .databaseId" | head -n1)"
            if [ -n "$RUN_ID" ]; then
              echo "RC_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
              echo "Authoritative RC workflow run: $RUN_ID"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: dispatched RC workflow run was not found." >&2
          exit 1

      - name: Wait for Final Clean-room PASS
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 360); do
            STATE="$(gh run view "$RC_RUN_ID" --json status,conclusion,headSha,url)"
            STATUS="$(jq -r '.status' <<<"$STATE")"
            CONCLUSION="$(jq -r '.conclusion // ""' <<<"$STATE")"
            HEAD_SHA="$(jq -r '.headSha' <<<"$STATE")"
            URL="$(jq -r '.url' <<<"$STATE")"
            test "$HEAD_SHA" = "$RC_SHA" || {
              echo "ERROR: RC workflow head SHA drifted." >&2
              exit 1
            }
            echo "RC gate status=$STATUS conclusion=$CONCLUSION url=$URL"
            if [ "$STATUS" = "completed" ]; then
              test "$CONCLUSION" = "success" || {
                echo "ERROR: Final Clean-room gate did not PASS." >&2
                gh run view "$RC_RUN_ID" --log-failed || true
                exit 1
              }
              echo "RC_RUN_URL=$URL" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 15
          done
          echo "ERROR: Final Clean-room gate did not complete in bootstrap timeout." >&2
          exit 1

      - name: Create GA tag only after Final Clean-room PASS
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CPIM-MES Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin "$RC_BRANCH" --tags
          test "$(git rev-parse "origin/$RC_BRANCH")" = "$RC_SHA"
          git tag -a "$GA_TAG" "$RC_SHA" \
            -m "CPIM-MES v0.41.1 Production Hardening" \
            -m "Final Clean-room PASS: $RC_RUN_URL"
          git push origin "refs/tags/$GA_TAG"

      - name: Verify GA tag identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags
          test "$(git rev-list -n1 "$GA_TAG")" = "$RC_SHA"
          echo "GA_TAG=$GA_TAG"
          echo "GA_COMMIT=$RC_SHA"
          echo "FINAL_GATE=$RC_RUN_URL"
