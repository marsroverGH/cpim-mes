name: Bootstrap v0.41.1 RC object preparation

on:
  push:
    branches:
      - bootstrap/v0.41.1-rc.1-upload

permissions:
  contents: write

concurrency:
  group: bootstrap-v0.41.1-rc.1-object
  cancel-in-progress: false

jobs:
  prepare-rc-object:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REGISTER_SHA: abf63fba0bec7d36316b61f053c966adf7ac06a8
      RC_BRANCH: release/v0.41.1-rc.1
      GA_TAG: v0.41.1
      DELTA_SHA256: 146a1cb4cbb6e4cfee802fc74add60a3b11ca1e99efd13765c30f9f7f370fcf0
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Preflight immutable repository state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$REGISTER_SHA" || {
            echo "ERROR: main moved from expected workflow-registration commit." >&2
            exit 1
          }
          if git ls-remote --exit-code --heads origin "$RC_BRANCH" >/dev/null 2>&1; then
            echo "ERROR: $RC_BRANCH already exists; refusing overwrite." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$GA_TAG" >/dev/null 2>&1; then
            echo "ERROR: tag $GA_TAG already exists; refusing overwrite." >&2
            exit 1
          fi

      - name: Reconstruct frozen RC source tree locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rc-delta
          base64 --decode .rc-upload/delta.b64 > /tmp/rc-delta.tar.xz
          echo "$DELTA_SHA256  /tmp/rc-delta.tar.xz" | sha256sum -c -
          tar -tJf /tmp/rc-delta.tar.xz >/dev/null

          git checkout --detach "$REGISTER_SHA"
          tar -xJf /tmp/rc-delta.tar.xz -C .
          rm -f             .DS_Store             backend/.DS_Store             cpim-mes-v0.39.0-e2e-state-isolation-hotfix.patch             cpim-mes-v0.39.0-realtime-dispatch-dynamic-rescheduling-schedule-adherence.patch
          git add -A
          python3 scripts/verify_source_checksums.py

      - name: Create remote RC Git commit object without moving a ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys

          repo = os.environ["GITHUB_REPOSITORY"]
          parent = os.environ["REGISTER_SHA"]

          def gh_api(path, payload=None):
              cmd = ["gh", "api"]
              if payload is not None:
                  cmd += ["--method", "POST", path, "--input", "-"]
              else:
                  cmd += [path]
              p = subprocess.run(
                  cmd,
                  input=(json.dumps(payload) if payload is not None else None),
                  text=True,
                  capture_output=True,
              )
              if p.returncode != 0:
                  print("GH API FAILED:", " ".join(cmd), file=sys.stderr)
                  print(p.stderr, file=sys.stderr)
                  raise SystemExit(p.returncode)
              return json.loads(p.stdout)

          current_tree = gh_api(
              f"repos/{repo}/git/commits/{parent}"
          )["tree"]["sha"]

          names = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only", "-z"]
          ).decode().split("\0")
          names = [n for n in names if n]

          entries = []
          for path in names:
              p = pathlib.Path(path)
              if not p.exists():
                  entries.append({
                      "path": path,
                      "mode": "100644",
                      "type": "blob",
                      "sha": None,
                  })
                  continue

              ls = subprocess.check_output(
                  ["git", "ls-files", "-s", "--", path],
                  text=True,
              ).strip().split()
              entries.append({
                  "path": path,
                  "mode": ls[0],
                  "type": "blob",
                  "sha": ls[1],
              })

          for offset in range(0, len(entries), 40):
              chunk = entries[offset:offset + 40]
              print(
                  f"Creating tree chunk {offset // 40 + 1}: "
                  f"{len(chunk)} entries"
              )
              current_tree = gh_api(
                  f"repos/{repo}/git/trees",
                  {"base_tree": current_tree, "tree": chunk},
              )["sha"]

          commit = gh_api(
              f"repos/{repo}/git/commits",
              {
                  "message": "release: prepare v0.41.1-rc.1 production hardening",
                  "tree": current_tree,
                  "parents": [parent],
              },
          )["sha"]

          pathlib.Path("/tmp/rc-commit-sha.txt").write_text(commit + "\n")
          print(f"REMOTE_RC_COMMIT={commit}")
          print(f"REMOTE_RC_TREE={current_tree}")
          print(f"CHANGED_PATHS={len(entries)}")
          PY

      - name: Upload RC commit identity
        uses: actions/upload-artifact@v7.0.2
        with:
          name: v0.41.1-rc.1-commit-identity
          path: /tmp/rc-commit-sha.txt
          if-no-files-found: error
          retention-days: 7
