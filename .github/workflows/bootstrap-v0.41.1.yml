name: Prepare v0.41.1-rc.2 source branch

on:
  push:
    branches:
      - bootstrap/v0.41.1-rc.1-upload

permissions:
  contents: write

concurrency:
  group: prepare-v0.41.1-rc.2
  cancel-in-progress: false

jobs:
  prepare-rc2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RC1_BRANCH: release/v0.41.1-rc.1
      RC1_SHA: d7c7f07f4591bfdb06c8d1e3a068c59bad07403e
      RC2_BRANCH: release/v0.41.1-rc.2
      GA_TAG: v0.41.1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RC1_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Preflight immutable RC1 and absent RC2/tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$RC1_BRANCH" --tags
          test "$(git rev-parse HEAD)" = "$RC1_SHA"
          test "$(git rev-parse "origin/$RC1_BRANCH")" = "$RC1_SHA"
          if git ls-remote --exit-code --heads origin "$RC2_BRANCH" >/dev/null 2>&1; then
            echo "ERROR: $RC2_BRANCH already exists; refusing overwrite." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$GA_TAG" >/dev/null 2>&1; then
            echo "ERROR: $GA_TAG already exists; refusing overwrite." >&2
            exit 1
          fi

      - name: Apply minimal RC2 fixture and metadata update
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          p = Path("backend/internal/api/router_config_test.go")
          s = p.read_text()
          if '"github.com/cpim-mes/backend/internal/service"' not in s:
              s = s.replace(
                  '"testing"\n)',
                  '"testing"\n\n\t"github.com/cpim-mes/backend/internal/service"\n)',
              )
          s = s.replace(
              "NewRouter(nil, RouterConfig{",
              "NewRouter(&service.Services{}, RouterConfig{",
          )
          p.write_text(s)

          files = subprocess.check_output(
              ["git", "ls-files", "-z"]
          ).decode().split("\0")
          for name in files:
              if not name or name == ".github/workflows/release-candidate.yml":
                  continue
              q = Path(name)
              try:
                  text = q.read_text()
              except (UnicodeDecodeError, IsADirectoryError):
                  continue
              if "v0.41.1-rc.1" in text:
                  q.write_text(text.replace("v0.41.1-rc.1", "v0.41.1-rc.2"))
          PY
          gofmt -w backend/internal/api/router_config_test.go

      - name: Recalculate governed source checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          checksum = Path("SHA256SUMS.txt")
          out = []
          for line in checksum.read_text().splitlines():
              if not line.strip():
                  continue
              old_hash, path = line.split("  ", 1)
              p = Path(path)
              if not p.is_file():
                  raise SystemExit(f"checksum path missing: {path}")
              digest = hashlib.sha256(p.read_bytes()).hexdigest()
              out.append(f"{digest}  {path}")
          checksum.write_text("\n".join(out) + "\n")
          PY
          python3 scripts/verify_source_checksums.py
          python3 scripts/check_runtime_versions.py
          python3 scripts/check_dependency_locks.py
          python3 scripts/check_ci_dependency_policy.py

      - name: Commit and push RC2 source branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CPIM-MES Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$RC2_BRANCH"
          git add -A
          git diff --cached --check
          git commit -m "release: prepare v0.41.1-rc.2 after clean-room fixture fix"
          RC2_SHA="$(git rev-parse HEAD)"
          echo "RC2_SOURCE_SHA=$RC2_SHA"
          git push origin "HEAD:refs/heads/$RC2_BRANCH"
