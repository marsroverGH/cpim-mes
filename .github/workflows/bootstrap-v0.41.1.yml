name: Finalize v0.41.1-rc.3 and promote GA

on:
  push:
    branches:
      - bootstrap/v0.41.1-rc.1-upload

permissions:
  contents: write
  actions: write

concurrency:
  group: finalize-v0.41.1-rc.3
  cancel-in-progress: false

jobs:
  finalize-rc3:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RC3_BRANCH: release/v0.41.1-rc.3
      GA_TAG: v0.41.1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RC3_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Preflight RC3 and absent GA tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$RC3_BRANCH" --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$RC3_BRANCH")"
          grep -q "RC_VERSION: 'v0.41.1-rc.3'" .github/workflows/release-candidate.yml
          if git ls-remote --exit-code --tags origin "refs/tags/$GA_TAG" >/dev/null 2>&1; then
            echo "ERROR: $GA_TAG already exists; refusing overwrite." >&2
            exit 1
          fi

      - name: Fix remaining nil Router test fixture and RC3 metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          p = Path("backend/internal/api/version_test.go")
          s = p.read_text()
          if '"github.com/cpim-mes/backend/internal/service"' not in s:
              s = s.replace(
                  '"testing"\n',
                  '"testing"\n\n\t"github.com/cpim-mes/backend/internal/service"\n',
              )
          s = s.replace(
              "NewRouter(nil, RouterConfig{",
              "NewRouter(&service.Services{}, RouterConfig{",
          )
          p.write_text(s)

          files = subprocess.check_output(
              ["git", "ls-files", "-z"]
          ).decode().split("\0")
          for name in files:
              if not name or name == ".github/workflows/release-candidate.yml":
                  continue
              q = Path(name)
              try:
                  text = q.read_text()
              except (UnicodeDecodeError, IsADirectoryError):
                  continue
              if "v0.41.1-rc.2" in text:
                  q.write_text(text.replace("v0.41.1-rc.2", "v0.41.1-rc.3"))
          PY
          gofmt -w backend/internal/api/version_test.go
          if grep -R "NewRouter(nil" -n backend/internal/api --include='*_test.go'; then
            echo "ERROR: nil Router test fixture remains" >&2
            exit 1
          fi

      - name: Recalculate and verify governed source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          checksum = Path("SHA256SUMS.txt")
          out = []
          for line in checksum.read_text().splitlines():
              if not line.strip():
                  continue
              _, path = line.split("  ", 1)
              p = Path(path)
              if not p.is_file():
                  raise SystemExit(f"checksum path missing: {path}")
              out.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {path}")
          checksum.write_text("\n".join(out) + "\n")
          PY
          python3 scripts/verify_source_checksums.py
          python3 scripts/check_runtime_versions.py
          python3 scripts/check_dependency_locks.py
          python3 scripts/check_ci_dependency_policy.py
          python3 backend/scripts/check_final_release_candidate.py
          python3 scripts/test_release_candidate_unit.py

      - name: Commit RC3 fix if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CPIM-MES Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "release: finalize v0.41.1-rc.3 after router test fixture fixes"
            git push origin "HEAD:refs/heads/$RC3_BRANCH"
          fi
          RC3_SHA="$(git rev-parse HEAD)"
          echo "RC3_SHA=$RC3_SHA" >> "$GITHUB_ENV"
          echo "RC3_SHA=$RC3_SHA"

      - name: Dispatch authoritative Final Clean-room Gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release-candidate.yml --ref "$RC3_BRANCH"
          for i in $(seq 1 60); do
            RUN_ID="$(gh run list --workflow release-candidate.yml --branch "$RC3_BRANCH" --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$RC3_SHA\") | .databaseId" | head -n1)"
            if [ -n "$RUN_ID" ]; then
              echo "RC_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
              echo "RC_RUN_ID=$RUN_ID"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: dispatched RC3 workflow run not found" >&2
          exit 1

      - name: Wait for Final Clean-room PASS
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 360); do
            STATE="$(gh run view "$RC_RUN_ID" --json status,conclusion,headSha,url)"
            STATUS="$(jq -r '.status' <<<"$STATE")"
            CONCLUSION="$(jq -r '.conclusion // ""' <<<"$STATE")"
            HEAD_SHA="$(jq -r '.headSha' <<<"$STATE")"
            URL="$(jq -r '.url' <<<"$STATE")"
            test "$HEAD_SHA" = "$RC3_SHA"
            echo "RC3 gate status=$STATUS conclusion=$CONCLUSION url=$URL"
            if [ "$STATUS" = "completed" ]; then
              test "$CONCLUSION" = "success" || {
                gh run view "$RC_RUN_ID" --log-failed || true
                exit 1
              }
              echo "RC_RUN_URL=$URL" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 15
          done
          echo "ERROR: Final Clean-room gate timeout" >&2
          exit 1

      - name: Create annotated GA tag after PASS only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CPIM-MES Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git tag -a "$GA_TAG" "$RC3_SHA" \
            -m "CPIM-MES v0.41.1 Production Hardening" \
            -m "Final Clean-room PASS: $RC_RUN_URL"
          git push origin "refs/tags/$GA_TAG"

      - name: Verify GA tag identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags
          test "$(git rev-list -n1 "$GA_TAG")" = "$RC3_SHA"
          echo "GA_TAG=$GA_TAG"
          echo "GA_COMMIT=$RC3_SHA"
          echo "FINAL_GATE=$RC_RUN_URL"
