name: Finalize v0.41.1-rc.15 and promote GA

on:
  push:
    branches:
      - bootstrap/v0.41.1-rc.1-upload

permissions:
  contents: write
  actions: write

concurrency:
  group: promote-v0.41.1-rc.15
  cancel-in-progress: false

jobs:
  finalize-gate-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      RC_BRANCH: release/v0.41.1-rc.15
      GA_TAG: v0.41.1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RC_BRANCH }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          ! git ls-remote --exit-code --tags origin "refs/tags/$GA_TAG" >/dev/null 2>&1
      - name: Freeze RC15 metadata and verify backend
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          skip={".git","node_modules","dist","playwright-report","test-results"}
          for p in Path(".").rglob("*"):
              if not p.is_file() or any(x in skip for x in p.parts) or p.as_posix().startswith(".github/workflows/"):
                  continue
              try: s=p.read_text(encoding="utf-8")
              except UnicodeDecodeError: continue
              ns=s
              for old in ["v0.41.1-rc.10","v0.41.1-rc.11","v0.41.1-rc.12"]:
                  ns=ns.replace(old,"v0.41.1-rc.15")
              if ns!=s: p.write_text(ns,encoding="utf-8")
          PY
          cd backend
          go mod verify
          go vet -mod=readonly ./...
          go test -mod=readonly -race -count=1 ./...
          cd ..
      - name: Regenerate checksums and static gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          excluded={".git","node_modules","dist","playwright-report","test-results","release-candidate-bundle","security-release-bundle",".secrets"}
          files=[p for p in Path(".").rglob("*") if p.is_file() and p.name!="SHA256SUMS.txt" and not any(x in excluded for x in p.parts)]
          Path("SHA256SUMS.txt").write_text("\n".join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  ./{p.as_posix()}" for p in sorted(files,key=lambda x:x.as_posix()))+"\n",encoding="utf-8")
          PY
          python3 scripts/verify_source_checksums.py
          python3 backend/scripts/check_final_release_candidate.py
          python3 backend/scripts/check_cookie_auth_csrf.py
          python3 backend/scripts/check_user_administration.py
          python3 backend/scripts/check_security_supply_chain.py
          python3 scripts/test_release_candidate_unit.py
      - name: Commit RC15 freeze
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CPIM-MES Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "release: freeze v0.41.1-rc.15"
            git push origin "HEAD:refs/heads/$RC_BRANCH"
          fi
          echo "RC_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Dispatch Final Clean-room
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release-candidate.yml --ref "$RC_BRANCH"
          for i in $(seq 1 60); do
            id="$(gh run list --workflow release-candidate.yml --branch "$RC_BRANCH" --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$RC_SHA\") | .databaseId" | head -n1)"
            if [ -n "$id" ]; then echo "RC_RUN_ID=$id" >> "$GITHUB_ENV"; exit 0; fi
            sleep 5
          done
          exit 1
      - name: Wait for Final Clean-room PASS
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 480); do
            s="$(gh run view "$RC_RUN_ID" --json status,conclusion,headSha,url)"
            status="$(jq -r .status <<<"$s")"; conclusion="$(jq -r '.conclusion // ""' <<<"$s")"; head="$(jq -r .headSha <<<"$s")"; url="$(jq -r .url <<<"$s")"
            test "$head" = "$RC_SHA"
            echo "RC15 gate status=$status conclusion=$conclusion url=$url"
            if [ "$status" = completed ]; then
              test "$conclusion" = success || { gh run view "$RC_RUN_ID" --log-failed || true; exit 1; }
              echo "RC_RUN_URL=$url" >> "$GITHUB_ENV"; exit 0
            fi
            sleep 15
          done
          exit 1
      - name: Promote verified RC15 to main and v0.41.1
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$RC_BRANCH" --tags
          test "$(git rev-parse "origin/$RC_BRANCH")" = "$RC_SHA"
          git merge-base --is-ancestor origin/main "$RC_SHA"
          git push origin "$RC_SHA:refs/heads/main"
          git tag -a "$GA_TAG" "$RC_SHA" -m "CPIM-MES v0.41.1 Production Hardening" -m "Final Clean-room PASS: $RC_RUN_URL"
          git push origin "refs/tags/$GA_TAG"
      - name: Verify GA identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$RC_SHA"
          test "$(git rev-list -n1 "$GA_TAG")" = "$RC_SHA"
          echo "GA_COMMIT=$RC_SHA"
          echo "FINAL_GATE=$RC_RUN_URL"
