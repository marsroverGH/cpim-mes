name: Security CI / Supply Chain

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.10'
  NODE_VERSION: '24.20.0'
  NPM_VERSION: '11.19.0'
  RELEASE_VERSION: 'v0.42.0'

jobs:
  dependency-security:
    name: Dependency vulnerability gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify clean source checkout
        # SHA256SUMS.txt is generated from HEAD (fails if tracked files differ),
        # then verified (fails on unexpected untracked files or symlinks).
        run: |
          python3 scripts/generate_source_checksums.py --require-clean
          python3 scripts/verify_source_checksums.py
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global npm@${{ env.NPM_VERSION }}
      - name: Install pinned govulncheck
        env:
          SECURITY_TOOL_BIN_DIR: ${{ runner.temp }}/cpim-security-tools
        run: ./scripts/install_security_tools.sh dependency
      - name: Run dependency security gates
        env:
          SECURITY_TOOL_BIN_DIR: ${{ runner.temp }}/cpim-security-tools
          SECURITY_REPORT_DIR: ${{ runner.temp }}/cpim-security-reports
        run: ./scripts/run_dependency_security_gate.sh
      - name: Upload dependency security reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dependency-security-${{ github.run_id }}
          path: ${{ runner.temp }}/cpim-security-reports
          if-no-files-found: error
          retention-days: 14

  container-supply-chain:
    name: Container scan and SBOM
    runs-on: ubuntu-latest
    outputs:
      build_time: ${{ steps.metadata.outputs.build_time }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Prepare immutable build metadata
        id: metadata
        shell: bash
        run: |
          build_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "build_time=$build_time" >> "$GITHUB_OUTPUT"
          echo "BUILD_TIME=$build_time" >> "$GITHUB_ENV"
      - name: Build deployable images for scanning
        shell: bash
        run: |
          docker build --pull \
            --build-arg RELEASE_VERSION="${RELEASE_VERSION}" \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg BUILD_TIME="${BUILD_TIME}" \
            --tag "cpim-mes-backend:${GITHUB_SHA}" \
            backend
          docker build --pull \
            --build-arg RELEASE_VERSION="${RELEASE_VERSION}" \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg BUILD_TIME="${BUILD_TIME}" \
            --tag "cpim-mes-frontend:${GITHUB_SHA}" \
            frontend
      - name: Install checksum-verified Trivy and Syft
        env:
          SECURITY_TOOL_BIN_DIR: ${{ runner.temp }}/cpim-security-tools
        run: ./scripts/install_security_tools.sh container
      - name: Generate SPDX SBOMs and scan runtime images
        env:
          SECURITY_TOOL_BIN_DIR: ${{ runner.temp }}/cpim-security-tools
          SECURITY_ARTIFACT_DIR: ${{ runner.temp }}/cpim-security-artifacts
          BACKEND_IMAGE: cpim-mes-backend:${{ github.sha }}
          FRONTEND_IMAGE: cpim-mes-frontend:${{ github.sha }}
        run: ./scripts/run_container_security_gate.sh
      - name: Upload SBOM and container security reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: container-security-${{ github.run_id }}
          path: ${{ runner.temp }}/cpim-security-artifacts
          if-no-files-found: error
          retention-days: 14

  release-bundle:
    name: Verified security release bundle
    runs-on: ubuntu-latest
    needs: [dependency-security, container-supply-chain]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Download dependency security evidence
        uses: actions/download-artifact@v8.0.2
        with:
          name: dependency-security-${{ github.run_id }}
          path: security-reports
      - name: Download container security evidence
        uses: actions/download-artifact@v8.0.2
        with:
          name: container-security-${{ github.run_id }}
          path: security-artifacts
      - name: Build release evidence bundle
        run: |
          python3 scripts/build_release_bundle.py \
            --dependency-reports security-reports \
            --container-artifacts security-artifacts \
            --output release-bundle \
            --commit "${GITHUB_SHA}" \
            --build-time "${{ needs.container-supply-chain.outputs.build_time }}"
      - name: Verify release bundle supply chain
        run: python3 scripts/verify_release_bundle.py release-bundle
      - name: Archive verified release evidence
        run: tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf cpim-mes-v0.42.0-security-release-bundle.tar.gz release-bundle
      - name: Upload verified release bundle
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cpim-mes-v0.42.0-security-release-bundle-${{ github.run_id }}
          path: |
            release-bundle
            cpim-mes-v0.42.0-security-release-bundle.tar.gz
          if-no-files-found: error
          retention-days: 30
