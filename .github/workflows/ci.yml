name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.10'
  NODE_VERSION: '24.20.0'
  NPM_VERSION: '11.19.0'
  RELEASE_VERSION: 'v0.44.0'

jobs:
  dependency-locks:
    name: Dependency locks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.12'
      - name: Pin npm
        run: npm install --global npm@${{ env.NPM_VERSION }}
      - name: Validate supported runtime matrix
        run: python3 scripts/check_runtime_versions.py
      - name: Re-generate dependency locks
        run: ./scripts/generate-lockfiles.sh
      - name: Validate dependency locks
        run: python3 scripts/check_dependency_locks.py
      - name: Require lockfiles to be committed and reproducible
        run: |
          for f in backend/go.sum frontend/package-lock.json e2e/package-lock.json; do
            git ls-files --error-unmatch "$f" >/dev/null 2>&1 || {
              echo "ERROR: $f was generated but is not committed." >&2
              echo "Download the dependency-lockfiles artifact or run ./scripts/generate-lockfiles.sh locally, then commit it." >&2
              exit 1
            }
          done
          git diff --exit-code -- \
            backend/go.mod backend/go.sum \
            frontend/package.json frontend/package-lock.json \
            e2e/package.json e2e/package-lock.json
      - name: Upload generated locks for bootstrap/debugging
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dependency-lockfiles-${{ github.run_id }}
          path: |
            backend/go.mod
            backend/go.sum
            frontend/package-lock.json
            e2e/package-lock.json
          if-no-files-found: ignore

  backend:
    name: Backend / Go
    runs-on: ubuntu-latest
    needs: dependency-locks
    services:
      # Disposable PostgreSQL for database integration tests (internal/testdb).
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_USER: cpim
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cpim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: Download locked modules
        working-directory: backend
        run: go mod download
      - name: Verify module checksums
        working-directory: backend
        run: go mod verify
      - name: Ensure module files are tidy and unchanged
        working-directory: backend
        run: |
          cp go.mod /tmp/go.mod.before
          cp go.sum /tmp/go.sum.before
          go mod tidy
          cmp -s go.mod /tmp/go.mod.before
          cmp -s go.sum /tmp/go.sum.before
      - name: Go vet
        working-directory: backend
        run: go vet -mod=readonly ./...
      - name: Go tests
        working-directory: backend
        env:
          CPIM_TEST_DATABASE_URL: postgres://cpim:ci-test-only@127.0.0.1:5432/postgres?sslmode=disable
        run: |
          go test -mod=readonly -race -count=1 ./... -coverprofile=coverage.out
          go tool cover -func=coverage.out | tail -1
      - name: Static business-integrity guards
        run: |
          python3 backend/scripts/check_rbac_routes.py
          python3 backend/scripts/check_bom_integrity.py
          python3 backend/scripts/check_final_operation_guard.py
          python3 backend/scripts/check_shopfloor_state_machine.py
          python3 backend/scripts/check_partial_purchase_receipts.py
          python3 backend/scripts/check_eco_effective_guard.py
          python3 backend/scripts/check_quality_transaction.py
          python3 backend/scripts/check_forecast_version_consumption.py
          python3 backend/scripts/check_sop_mps_disaggregation.py
          python3 backend/scripts/check_supplier_quality_ncr.py
          python3 backend/scripts/check_abc_annual_usage.py
          python3 backend/scripts/check_crp_finite_capacity.py
          python3 backend/scripts/check_detailed_scheduling.py
          python3 backend/scripts/check_sales_order_management.py
          python3 backend/scripts/check_advanced_order_promising.py
          python3 backend/scripts/check_backorder_processing.py
          python3 backend/scripts/check_full_pegging_exception_management.py
          python3 backend/scripts/check_supplier_scheduling_reliability.py
          python3 backend/scripts/check_inventory_policy.py
          python3 backend/scripts/check_maintenance_capacity.py
          python3 backend/scripts/check_production_performance.py
          python3 backend/scripts/check_realtime_dispatch_rescheduling.py
          python3 backend/scripts/check_production_control_tower.py
          python3 backend/scripts/check_recovery_planning.py
          python3 backend/scripts/check_controlled_recovery_execution.py
          python3 backend/scripts/check_migration_manager.py
          python3 backend/scripts/check_production_config.py
          python3 backend/scripts/check_demo_credentials_removed.py
          python3 backend/scripts/check_production_frontend_container.py
          python3 backend/scripts/check_cookie_auth_csrf.py
          python3 backend/scripts/check_login_rate_limit_auth_audit.py
          python3 backend/scripts/check_user_administration.py
          python3 backend/scripts/check_recovery_failed_persistence.py
          python3 backend/scripts/check_version_build_metadata.py
          python3 backend/scripts/check_observability.py
          python3 backend/scripts/check_backup_restore_dr.py
          python3 backend/scripts/check_security_supply_chain.py
          python3 backend/scripts/check_final_release_candidate.py
          python3 scripts/test_postgres_dr_unit.py
          python3 scripts/test_security_supply_chain_unit.py
          python3 scripts/test_release_candidate_unit.py
          python3 scripts/check_ci_dependency_policy.py

  frontend:
    name: Frontend / Vue
    runs-on: ubuntu-latest
    needs: dependency-locks
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pin npm
        run: npm install --global npm@${{ env.NPM_VERSION }}
      - name: Clean locked install
        working-directory: frontend
        run: npm ci
      - name: Build and typecheck
        working-directory: frontend
        run: npm run typecheck && npm run build

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Prepare build metadata
        run: |
          echo "VCS_REF=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Build production images
        env:
          POSTGRES_PASSWORD: ci-db-password
          DATABASE_URL: postgres://cpim:ci-db-password@db:5432/cpim?sslmode=disable
          JWT_SECRET: ci-only-secret-not-for-production
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml build --pull

  e2e:
    name: Integration / Playwright
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Prepare build metadata
        run: |
          echo "VCS_REF=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Pin npm
        run: npm install --global npm@${{ env.NPM_VERSION }}
      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Prepare ephemeral E2E bootstrap credentials
        run: |
          mkdir -p .secrets
          password="$(openssl rand -base64 36 | tr -d '\n')"
          printf '%s' "$password" > .secrets/bootstrap-admin-password
          chmod 600 .secrets/bootstrap-admin-password
          echo "::add-mask::$password"
          echo "E2E_ADMIN_USERNAME=ci-admin-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Start production topology with one-time admin bootstrap
        env:
          POSTGRES_PASSWORD: ci-db-password
          DATABASE_URL: postgres://cpim:ci-db-password@db:5432/cpim?sslmode=disable
          JWT_SECRET: ci-only-secret-not-for-production
        run: BOOTSTRAP_ADMIN_USERNAME="$E2E_ADMIN_USERNAME" docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.bootstrap.yml up -d --build
      - name: Wait for production frontend and proxied backend
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1 && curl -fsS http://localhost:8080/version >/dev/null 2>&1 && curl -fsS http://localhost:8080/api/openapi.json >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          POSTGRES_PASSWORD=ci-db-password DATABASE_URL='postgres://cpim:ci-db-password@db:5432/cpim?sslmode=disable' JWT_SECRET=ci-only-secret-not-for-production docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
          POSTGRES_PASSWORD=ci-db-password DATABASE_URL='postgres://cpim:ci-db-password@db:5432/cpim?sslmode=disable' JWT_SECRET=ci-only-secret-not-for-production docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --no-color
          exit 1
      - name: Step 10 private observability endpoint gate
        env:
          POSTGRES_PASSWORD: ci-db-password
          DATABASE_URL: postgres://cpim:ci-db-password@db:5432/cpim?sslmode=disable
          JWT_SECRET: ci-only-secret-not-for-production
        run: |
          POSTGRES_PASSWORD="$POSTGRES_PASSWORD" DATABASE_URL="$DATABASE_URL" JWT_SECRET="$JWT_SECRET" \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T backend \
            wget -qO- http://127.0.0.1:8080/metrics > /tmp/cpim-metrics.txt
          grep -q '^# HELP http_requests_total ' /tmp/cpim-metrics.txt
          grep -q '^# HELP db_open_connections ' /tmp/cpim-metrics.txt
          grep -q '^# HELP mrp_runs_total ' /tmp/cpim-metrics.txt
          grep -q '^# HELP recovery_simulation_failed_total ' /tmp/cpim-metrics.txt
          metrics_public_status="$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8080/metrics)"
          test "$metrics_public_status" = "404"
      - name: Step 8 forced recovery failure persistence gate
        env:
          E2E_BASE_URL: http://localhost:8080
          POSTGRES_PASSWORD: ci-db-password
          DATABASE_URL: postgres://cpim:ci-db-password@db:5432/cpim?sslmode=disable
          JWT_SECRET: ci-only-secret-not-for-production
        run: python3 scripts/test_recovery_failed_persistence.py
      - name: Run Playwright tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_EXPECTED_VERSION: ${{ env.RELEASE_VERSION }}
          E2E_EXPECTED_COMMIT: ${{ github.sha }}
        run: npx playwright test --workers=1
      - name: Step 11 live backup / restore drill gate
        env:
          POSTGRES_PASSWORD: ci-db-password
          DATABASE_URL: postgres://cpim:ci-db-password@db:5432/cpim?sslmode=disable
          JWT_SECRET: ci-only-secret-not-for-production
          CPIM_BACKUP_DIR: /tmp/cpim-mes-backups
        run: |
          ./scripts/restore_drill.sh
          test ! -e /tmp/cpim-mes-backups || test -z "$(find /tmp/cpim-mes-backups -type f -print -quit)"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
      - name: Docker logs
        if: failure()
        run: POSTGRES_PASSWORD=ci-db-password DATABASE_URL='postgres://cpim:ci-db-password@db:5432/cpim?sslmode=disable' JWT_SECRET=ci-only-secret-not-for-production docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --no-color
      - name: Stop stack
        if: always()
        run: |
          BOOTSTRAP_ADMIN_USERNAME="$E2E_ADMIN_USERNAME" POSTGRES_PASSWORD=ci-db-password DATABASE_URL='postgres://cpim:ci-db-password@db:5432/cpim?sslmode=disable' JWT_SECRET=ci-only-secret-not-for-production docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.bootstrap.yml down -v --remove-orphans
          rm -f .secrets/bootstrap-admin-password
